name: iPhone experimental build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Target (release_arm64 for iPhone)
        type: choice
        options: [release_arm64, debug_sim_arm64]
        default: release_arm64

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.configuration }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check owner API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PYTHON'
          import os, re, sys
          if not re.fullmatch(r'[1-9][0-9]*', os.environ.get('TELEGRAM_API_ID', '')) or not re.fullmatch(r'[0-9a-fA-F]{32}', os.environ.get('TELEGRAM_API_HASH', '')):
              sys.exit('Set TELEGRAM_API_ID and TELEGRAM_API_HASH repository Actions secrets before building.')
          PYTHON
      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("ios/versions.json"))["xcode"])')
          test -d "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          echo "DEVELOPER_DIR=/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" >> "$GITHUB_ENV"
          df -h .
      - name: Cache public dependency downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiryyyyx-repository-cache
          key: public-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/UPSTREAM_COMMIT', 'ios/versions.json') }}-v1
      - name: Test hidden chat store and compile selected target
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SWIRIX_CONFIGURATION: ${{ inputs.configuration }}
          SWIRIX_REPOSITORY_CACHE: ${{ runner.temp }}/swiryyyyx-repository-cache
        run: python3 -u ios/ci_simulator.py
      - name: Upload unsigned iPhone IPA
        if: inputs.configuration == 'release_arm64'
        uses: actions/upload-artifact@v4
        with:
          name: swiryyyyX-ios-unsigned
          path: ${{ runner.temp }}/swiryyyyx-artifacts/swiryyyyX-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload simulator application
        if: inputs.configuration == 'debug_sim_arm64'
        uses: actions/upload-artifact@v4
        with:
          name: swiryyyyX-ios-simulator
          path: ${{ runner.temp }}/swiryyyyx-artifacts/swiryyyyX-simulator.zip
          if-no-files-found: error
          retention-days: 7
